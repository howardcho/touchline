plugins { id 'com.android.application' }

android {
    namespace 'com.agedskaters.touchline'
    compileSdk 35
    defaultConfig {
        applicationId 'com.agedskaters.touchline'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    androidResources { noCompress 'mp3' }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.android.billingclient:billing:9.1.0'
}

tasks.register('prepareWeb', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'android/prepare_web.py'
    inputs.files(fileTree('../..') {
        include '*.mjs', '*.html', '*.css', '*.png', '*.svg', '*.webmanifest', 'audio/**',
                'native/index.html', 'ios/prepare_web.py', 'android/prepare_web.py', 'android/host.js'
    })
    outputs.dir 'src/main/assets'
}
tasks.named('preBuild').configure { dependsOn 'prepareWeb' }
