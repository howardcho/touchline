plugins { id 'com.android.application' }

android {
    namespace 'com.agedathletics.touchline'
    compileSdk 36
    defaultConfig {
        applicationId 'com.agedathletics.touchline'
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName '1.1.2'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    androidResources { noCompress 'mp3' }
}

tasks.register('prepareWeb', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'android/prepare_web.py'
    inputs.files(fileTree('../..') {
        include '*.mjs', '*.html', '*.css', '*.png', '*.svg', '*.webmanifest', 'audio/**',
                'native/index.html', 'ios/prepare_web.py', 'android/prepare_web.py', 'android/host.js'
    })
    outputs.dir 'src/main/assets'
}
tasks.named('preBuild').configure { dependsOn 'prepareWeb' }
